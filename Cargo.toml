[workspace]
members = ["crates/eventsdb-core", "crates/eventsdb-sqlite"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ynishi/eventsdb"
homepage = "https://github.com/ynishi/eventsdb"

[workspace.dependencies]
eventsdb-core = { path = "crates/eventsdb-core", version = "0.1.0" }

async-trait = "0.1"
futures-core = "0.3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# rusqlite-isle 0.5 tracks rusqlite 0.37. `libsqlite3-sys` declares
# `links = "sqlite3"`, so the graph holds exactly one major of it: this pin and
# the isle's track must move together.
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
rusqlite-isle = { version = "0.5", features = ["tokio"] }

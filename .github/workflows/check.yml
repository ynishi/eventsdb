# The four gates, run where the repository can state their result.
#
# CONTRIBUTING.md's Verification section is what defines green; this file
# runs it. The four are separate steps rather than one, because there is no
# recipe runner here to name the gate that failed — with one step, a red run
# would say only that something in a four-command script exited non-zero.
# The cost is that the composition lives in two places: a fifth gate added
# to CONTRIBUTING.md and not here would go unrun, and nothing detects that.
#
# No path filter, deliberately. A prose-only change cannot move any of these
# four answers, so filtering would save a run — but a whole run is about two
# minutes here, and skipping carries a trap that costs more than it saves:
# GitHub creates no check run for a skipped workflow, and a *required* check
# turns that absence into a pending one, which a prose-only pull request can
# never satisfy. The filter would have to be undone the day branch
# protection is turned on. Not having one is the simpler thing to keep true.
#
# `workflow_dispatch` is here so a commit can be asked for a verdict again
# without pushing anything — a green run that was green for the wrong reason
# (a cache, a toolchain that moved) is re-run rather than argued about.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# On a pull request a newer push makes the older run's answer irrelevant. On
# `main` it does not: two merges in quick succession would cancel the first
# commit's run and leave that commit with no verdict, which is the case this
# workflow exists to cover — a change green on its branch and red once
# merged is not something a branch can answer for itself.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Everything up to now was verified on macOS. `rusqlite` is used with
    # `bundled`, so SQLite is compiled from source rather than linked from
    # the system, and nothing in the workspace is behind a `cfg(target_os)`
    # — which is why a Linux runner should give the same answer at a tenth
    # of the minute. Should: this is the first build here on Linux, and the
    # first run is what establishes it rather than this comment.
    runs-on: ubuntu-latest
    # The suite itself is 19 s once built. The rest is the dependency graph,
    # of which SQLite compiled from source is most of it, and only the first
    # run pays for that.
    timeout-minutes: 30

    # Debug info is written on a runner and read never. `line-tables-only`
    # keeps what panics and backtraces use — the file and line — and drops
    # the rest, which is most of the bytes linked into every test binary.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v4

      # No rust-toolchain.toml here, so this follows stable and the
      # toolchain moves under the workflow. That means a red run is not
      # always about the change that triggered it — a clippy release
      # arriving with new lints turns the whole workspace red on a day
      # nobody touched it. Accepted for now: the alternative is a pin that
      # has to be raised by hand, and a workspace that meets three years of
      # lints at once when somebody finally does. `rust-version = "1.82"` is
      # the floor this repository promises and is a separate question from
      # the ceiling it is built against; nothing here checks the floor yet.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Caches ~/.cargo and the dependency half of target/. The workspace's
      # own three crates are not cached by this action, so they are
      # recompiled and re-linted every run: the verdict is recomputed rather
      # than replayed.
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-features --all-targets

      - name: cargo test
        run: cargo test --workspace --all-features

      # --all-features matters most here: the facade's backend sits behind a
      # feature, and this gate has already caught an intra-doc link that
      # resolves with it on and breaks with it off. Both states are checked
      # for that reason — the second run costs a rustdoc pass and no
      # compilation, because the first one built everything.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --all-features --no-deps
          cargo doc -p eventsdb --no-deps

[package]
name = "eventsdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "An embedded append-only event store: the contract and its backends under one name"
keywords = ["event-sourcing", "event-store", "event-log", "append-only", "cqrs"]
categories = ["database-implementations", "data-structures", "asynchronous"]

# What ships. The README and the licences are symlinks to the workspace root,
# so the crate carries its own copy without a second file to keep in step.
include = ["src/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# The backend is a feature rather than a dependency, so taking this crate for
# the contract alone does not pull in SQLite.
[features]
sqlite = ["dep:eventsdb-sqlite"]

# Forwarded rather than reinvented: the instrumentation is the backend's, and
# a caller who took the backend through this name has no other way to reach
# its feature. Weak (`?`), so asking for it without `sqlite` turns nothing on
# instead of quietly pulling SQLite in.
tracing = ["eventsdb-sqlite?/tracing"]

[dependencies]
eventsdb-core.workspace = true
eventsdb-sqlite = { path = "../eventsdb-sqlite", version = "0.5.0", optional = true }

# `sqlite` is off by default, so without this docs.rs would publish a page with
# no backend on it.
[package.metadata.docs.rs]
all-features = true

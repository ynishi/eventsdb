[package]
name = "eventsdb-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SQLite backend for eventsdb: durable append-only log with global positions"
keywords = ["event-sourcing", "event-store", "sqlite", "append-only", "cqrs"]
categories = ["database-implementations", "database", "asynchronous"]

# What ships. The tests and benches are on the list because the README cites
# them by name as the measurements behind its claims — dropping them would
# leave a reader on crates.io with references that go nowhere.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "benches/**/*.rs",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
eventsdb-core.workspace = true

async-stream = "0.3"
async-trait.workspace = true
futures-core.workspace = true
rusqlite.workspace = true
rusqlite-isle.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
criterion.workspace = true
futures-util = "0.3"
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# Criterion needs the default harness off so it can own `main`.
[[bench]]
name = "eventsdb"
harness = false

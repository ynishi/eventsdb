[package]
name = "eventsdb-sqlite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SQLite backend for eventsdb: durable append-only log with global positions"

[dependencies]
eventsdb-core.workspace = true

async-stream = "0.3"
async-trait.workspace = true
futures-core.workspace = true
rusqlite.workspace = true
rusqlite-isle.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
criterion.workspace = true
futures-util = "0.3"
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# Criterion needs the default harness off so it can own `main`.
[[bench]]
name = "eventsdb"
harness = false
